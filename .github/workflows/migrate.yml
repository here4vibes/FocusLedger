name: Run DB Migrations

# Manually-triggered drain of pending migrations against a database given by the
# DATABASE_URL repo secret. The credential lives only in GitHub's secret store and
# is injected on the runner — it never leaves CI. Runs the same migrate.js the app
# uses (idempotent, advisory-locked, fail-loud), so a bad migration fails the run
# instead of half-applying.
#
# Usage: Actions tab → "Run DB Migrations" → Run workflow → type "migrate" to confirm.
# Requires repo secret DATABASE_URL (Settings → Secrets and variables → Actions).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate" to confirm running pending migrations against DATABASE_URL'
        required: true
        default: ''

# Never let two migration runs overlap, even across triggers.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply pending migrations
    runs-on: ubuntu-latest
    steps:
      - name: Guard — require explicit confirmation
        if: ${{ inputs.confirm != 'migrate' }}
        run: |
          echo "::error::Confirmation failed — type 'migrate' in the confirm box to run. Nothing was changed."
          exit 1

      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Guard — require DATABASE_URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "::error::DATABASE_URL secret is not set. Add it under Settings → Secrets and variables → Actions, then re-run."
            exit 1
          fi
          echo "DATABASE_URL present — proceeding."

      - name: Run migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node migrate.js
