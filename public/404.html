<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <meta name="robots" content="noindex">
    <title>Page not found — FocusLedger</title>
    <link rel="icon" type="image/svg+xml" href="/icons/fl-icon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/fl-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', sans-serif; color: #1a1a1a; background: #faf9f7;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 2rem 1rem; text-align: center;
        }
        main { max-width: 420px; }
        .code { font-family: 'Space Grotesk', sans-serif; font-size: 3.5rem; font-weight: 700; color: #011e5c; }
        h1 { font-family: 'Space Grotesk', sans-serif; font-size: 1.5rem; margin: 0.5rem 0 0.75rem; color: #011e5c; }
        p { color: #6b6b6b; line-height: 1.55; margin-bottom: 1.75rem; }
        .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
        a.btn { display: inline-block; padding: 0.75rem 1.4rem; border-radius: 10px; text-decoration: none; font-weight: 500; }
        a.primary { background: #011e5c; color: #fff; }
        a.secondary { border: 1px solid #e8e5e0; color: #011e5c; background: #fff; }
    </style>
</head>
<body>
    <main>
        <div class="code">404</div>
        <h1>This page wandered off.</h1>
        <p>It happens to the best of us. The link may be old, or the address has a typo.</p>
        <div class="actions">
            <a class="btn primary" href="/">Go to the home page</a>
            <a class="btn secondary" href="/login">Log in</a>
        </div>
    </main>
</body>
</html>
