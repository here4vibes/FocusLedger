<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#011e5c"/>
<title>FocusLedger</title>
<style>
  :root{
    /* Brand design system (UI refactor Slice 2): navy + gold + teal on warm-white.
       Calm layout + serif "soul" kept; only the palette is harmonized to the brand. */
    --ground:#f3efe7;--canvas:#faf8f4;--surface:#ffffff;
    --ink:#1a1a1a;--muted:#5f6a78;--faint:#696d76; /* faint: 4.5:1+ on canvas/ground/white (WCAG AA) — was #9aa0ad @ 2.5:1 */
    --accent:#011e5c;--accent-soft:#e8ecf4;
    --warm:#c9a84c;--warm-soft:#f6efdc;
    --line:#e8e5e0;--line-2:#ddd8cf;
    --good:#5BA4A4;--good-soft:#e6f1f1;--alert:#c0552f;--alert-soft:#f7e6df;
    --serif:Georgia,"Iowan Old Style","Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:radial-gradient(120% 60% at 50% -10%,#fff 0%,var(--ground) 55%,#ece6da 100%);
    color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100dvh;overflow:hidden;}

  .top{display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + .6rem) 1.1rem .5rem;flex:none;}
  .brand{display:flex;align-items:center;gap:.5rem;}
  .brand .dot{width:26px;height:26px;border-radius:50%;background:#f5f0e2;overflow:hidden;
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(1,30,92,.2),inset 0 0 0 1px rgba(1,30,92,.14);}
  .dot img{width:100%;height:100%;object-fit:contain;display:block;}
  .brand .name{font-weight:700;font-size:.94rem;letter-spacing:-.01em;}
  .brand .name small{display:block;font-size:.66rem;color:var(--faint);font-weight:600;letter-spacing:.02em;}
  .top-actions{display:flex;align-items:center;gap:.45rem;}
  .chiplink{font-size:.72rem;color:var(--muted);text-decoration:none;font-weight:600;
    border:1px solid var(--line-2);border-radius:999px;padding:.3rem .65rem;background:var(--surface);white-space:nowrap;}
  .chiplink:active{background:var(--accent-soft);}
  .chiplink.today{color:var(--accent);border-color:transparent;background:var(--accent-soft);}

  .thread{flex:1;overflow-y:auto;padding:.5rem 1rem 1rem;display:flex;flex-direction:column;gap:.72rem;
    scroll-behavior:smooth;max-width:640px;width:100%;margin:0 auto;}
  .thread::-webkit-scrollbar{width:0;}

  .b{display:flex;gap:.5rem;align-items:flex-start;opacity:0;transform:translateY(6px);animation:in .32s ease forwards;}
  @keyframes in{to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.b,.u,.card,.chips,.tasklist .row.entering{animation:none;opacity:1;transform:none;}.typing i{animation:none;}.tasklist .row{transition:none;}}
  .b .dot{flex:none;width:27px;height:27px;border-radius:50%;background:#f5f0e2;overflow:hidden;
    display:grid;place-items:center;box-shadow:0 2px 8px rgba(1,30,92,.2),inset 0 0 0 1px rgba(1,30,92,.14);}
  .b .msg{font-size:.95rem;line-height:1.46;color:var(--ink);padding-top:2px;max-width:85%;}
  .b .msg.soul{font-family:var(--serif);font-size:1.05rem;line-height:1.34;}
  .b .msg strong{font-weight:700;}
  .b .msg em{font-style:italic;color:var(--muted);}
  .b .msg .fade{color:var(--faint);}
  .u{align-self:flex-end;background:var(--accent);color:#fff;font-size:.93rem;padding:.5rem .82rem;
    border-radius:16px 16px 4px 16px;max-width:82%;box-shadow:0 3px 10px rgba(1,30,92,.28);line-height:1.4;
    opacity:0;transform:translateY(6px);animation:in .28s ease forwards;word-wrap:break-word;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:.85rem .9rem;
    box-shadow:0 8px 20px -12px rgba(1,30,92,.26);max-width:96%;
    opacity:0;transform:translateY(6px);animation:in .32s ease forwards;}
  .card .k{font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;font-weight:700;color:var(--accent);}
  .card .t{font-size:1rem;font-weight:650;margin:.15rem 0 .3rem;letter-spacing:-.01em;}
  .card .say{font-size:.9rem;color:var(--muted);line-height:1.45;}
  .tasklist{display:flex;flex-direction:column;gap:.1rem;margin-top:.25rem;}
  .tasklist .row{display:flex;align-items:center;gap:.55rem;padding:.28rem 0;border-top:1px solid var(--line);}
  .tasklist .row:first-child{border-top:none;}
  .tasklist .box{width:19px;height:19px;border-radius:6px;border:2px solid var(--line-2);flex:none;}
  .tasklist .lbl{font-size:.93rem;font-weight:600;}
  .tasklist .due{font-size:.72rem;color:var(--faint);margin-left:auto;flex:none;font-variant-numeric:tabular-nums;}
  .tasklist .due.over{color:var(--alert);}

  /* Radar: tap the box to finish the task, right here. The row checks, bursts,
     then slides out and the next task steps up (the dopamine loop). */
  .tasklist .row{max-height:4rem;overflow:hidden;
    transition:max-height .3s ease,opacity .25s ease,padding .3s ease,border-color .3s ease;}
  .tasklist .row.entering{animation:in .32s ease;}
  .tasklist .row.leaving{max-height:0;opacity:0;padding-top:0;padding-bottom:0;border-color:transparent;}
  .tasklist .chk{flex:none;width:40px;height:40px;margin:-10px -6px -10px -10px;display:grid;place-items:center;
    background:none;border:none;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .tasklist .chk .box{position:relative;transition:background .18s ease,border-color .18s ease,transform .15s ease;}
  .tasklist .chk:hover .box{border-color:var(--good);}
  .tasklist .chk:active .box{transform:scale(.86);}
  .tasklist .chk:focus-visible{outline:2px solid var(--accent);outline-offset:-6px;border-radius:10px;}
  .tasklist .row.done .box{background:var(--good);border-color:var(--good);}
  .tasklist .row.done .box::after{content:'';position:absolute;left:5px;top:1px;width:5px;height:10px;
    border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .tasklist .row.done .lbl{text-decoration:line-through;color:var(--faint);}
  .tasklist .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .k .tally{float:right;color:var(--good);letter-spacing:.06em;}
  .card .cheer{font-size:.84rem;color:var(--good);font-weight:600;margin-top:.45rem;min-height:1.1em;
    transition:opacity .2s ease;}
  .card .cheer:empty{display:none;}
  .card .cheer .undo{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;
    font-size:.8rem;font-family:inherit;padding:0;text-decoration:underline;}
  .card .cheer .undo:disabled{color:var(--faint);cursor:default;text-decoration:none;}
  .card.clear{border-color:var(--good-soft);background:linear-gradient(180deg,var(--good-soft),var(--surface) 70%);}

  /* Bills coming up — from the bill guardian's recurring-charge predictions. */
  .billrow{display:flex;align-items:center;gap:.55rem;padding:.32rem 0;border-top:1px solid var(--line);}
  .billrow:first-of-type{border-top:none;}
  .billrow .bn{flex:1;min-width:0;font-size:.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .billrow .tag{flex:none;font-size:.56rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;
    border-radius:999px;padding:.12rem .4rem;background:var(--accent-soft);color:var(--accent);}
  .billrow .tag.sub{background:var(--warm-soft);color:#8a6d1f;}
  .billrow .bw{flex:none;font-size:.74rem;color:var(--faint);font-variant-numeric:tabular-nums;}
  .billrow .bw.soon{color:var(--alert);font-weight:600;}
  .billrow .ba{flex:none;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums;min-width:3.6rem;text-align:right;}
  /* Subscription rows open a review: cancel (a dated task + Buddy's steps), keep, or "it's a bill". */
  .billrow.subrow{cursor:pointer;-webkit-tap-highlight-color:transparent;border-radius:8px;}
  .billrow.subrow:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .billrow .chev{flex:none;color:var(--faint);font-size:.95rem;line-height:1;transition:transform .18s ease;margin-left:-.15rem;}
  .billrow.open .chev{transform:rotate(90deg);}
  .subpanel{background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:.6rem .7rem;margin:.1rem 0 .45rem;
    animation:in .25s ease;}
  .subpanel .say{font-size:.86rem;color:var(--ink);line-height:1.45;}
  .subpanel .say strong{font-weight:700;}
  .subpanel .chips{margin-top:.45rem;}
  .subpanel .chip{font-size:.8rem;padding:.4rem .7rem;}
  .subpanel .undo{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;
    font-size:.8rem;font-family:inherit;padding:0;margin-left:.35rem;text-decoration:underline;}
  .subpanel .undo:disabled{color:var(--faint);cursor:default;text-decoration:none;}
  .billrow .tag.pend{background:var(--good-soft);color:var(--good);}
  .subpanel a.chip{text-decoration:none;display:inline-block;}
  .subpanel ol.steps{margin:.5rem 0 0;padding-left:1.15rem;font-size:.86rem;line-height:1.45;color:var(--ink);}
  .subpanel ol.steps li{margin:.15rem 0;}
  .subpanel .fine{font-size:.78rem;color:var(--muted);margin-top:.4rem;line-height:1.4;}
  .cancelnote{border-radius:12px;padding:.55rem .7rem;margin:.1rem 0 .55rem;font-size:.86rem;line-height:1.45;}
  .cancelnote.win{background:var(--good-soft);color:#2f6f6f;}
  .cancelnote.win strong{color:#245757;}
  .cancelnote.alert{background:var(--alert-soft);color:#8a3a1d;}
  .cancelnote .chips{margin-top:.4rem;}
  .cancelnote .chip{font-size:.8rem;padding:.38rem .68rem;}
  .cancelnote a.chip{text-decoration:none;display:inline-block;}
  .billask{margin-top:.6rem;padding-top:.6rem;border-top:1px dashed var(--line-2);}
  .billask .q{font-size:.86rem;color:var(--ink);line-height:1.4;}
  .billask .chips{margin-top:.45rem;}
  .billask .chip{font-size:.8rem;padding:.4rem .7rem;}

  .mh{display:flex;justify-content:space-between;align-items:baseline;gap:.6rem;margin:.15rem 0 .5rem;}
  .mh .big{font-size:1.5rem;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
  .mh .split{font-size:.76rem;color:var(--muted);text-align:right;}
  .mh .split .imp{color:var(--alert);font-weight:600;}
  .catrow{display:flex;align-items:center;gap:.55rem;padding:.26rem 0;border-top:1px solid var(--line);}
  .catrow:first-of-type{border-top:none;}
  .catrow .ic{width:1.2rem;text-align:center;flex:none;}
  .catrow .cn{font-size:.88rem;font-weight:600;flex:none;min-width:5.5rem;}
  .catrow .track{flex:1;height:7px;background:var(--accent-soft);border-radius:4px;overflow:hidden;}
  .catrow .fill{height:100%;background:var(--accent);border-radius:4px;}
  .catrow .ca{font-size:.82rem;font-weight:700;font-variant-numeric:tabular-nums;flex:none;min-width:3.4rem;text-align:right;}

  .chips{display:flex;gap:.45rem;margin-top:.2rem;flex-wrap:wrap;opacity:0;animation:in .3s ease forwards;}
  .chip{font-size:.85rem;font-weight:600;padding:.48rem .8rem;border-radius:999px;cursor:pointer;border:none;
    font-family:inherit;transition:transform .1s ease;}
  .chip:active{transform:scale(.96);}
  .chip.solid{background:var(--accent);color:#fff;box-shadow:0 3px 10px rgba(1,30,92,.3);}
  .chip.ghost{background:var(--accent-soft);color:var(--accent);}
  .chip.good{background:var(--good-soft);color:var(--good);}
  .chip.warm{background:var(--warm-soft);color:var(--warm);}

  /* email confirmation card — reviewed + editable before anything sends */
  .card.confirm{border-color:var(--accent-soft);}
  .card .k.world{color:var(--accent);}
  .efield{display:flex;flex-direction:column;gap:.25rem;margin-top:.55rem;}
  .efield label{font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:var(--faint);}
  .efield .eto{font-size:.9rem;font-weight:600;color:var(--ink);}
  .efield input,.efield textarea{border:1px solid var(--line-2);border-radius:10px;padding:.5rem .6rem;
    font-family:inherit;font-size:.9rem;color:var(--ink);background:var(--canvas);width:100%;}
  .efield textarea{min-height:130px;resize:vertical;line-height:1.5;}
  .efield input:disabled,.efield textarea:disabled{opacity:.65;}
  .eactions{display:flex;align-items:center;gap:.5rem;margin-top:.75rem;flex-wrap:wrap;}
  .eactions .say{font-size:.84rem;color:var(--muted);}

  .note{align-self:flex-start;display:inline-flex;align-items:center;gap:.45rem;font-size:.76rem;
    color:var(--good);background:var(--good-soft);border-radius:999px;padding:.22rem .6rem .22rem .3rem;
    font-weight:600;opacity:0;animation:in .3s ease forwards;}
  .note.warm{color:var(--warm);background:var(--warm-soft);}
  .note.world{color:var(--accent);background:var(--accent-soft);}
  /* scope label — "App only" vs "Real world" so an in-app change is never
     confused with a real-world side effect (a sent email). */
  .note .scope{flex:none;font-size:.55rem;letter-spacing:.06em;text-transform:uppercase;font-weight:800;
    border-radius:999px;padding:.16rem .45rem;background:rgba(46,158,107,.16);color:var(--good);}
  .note.world .scope{background:var(--accent);color:#fff;}
  .note.warm .scope{background:rgba(201,138,47,.2);color:var(--warm);}
  .note .undo{background:none;border:none;color:var(--accent);font-weight:700;cursor:pointer;
    font-size:.75rem;font-family:inherit;padding:0;text-decoration:underline;}
  .note .undo:disabled{color:var(--faint);cursor:default;text-decoration:none;}

  .typing{display:flex;gap:4px;padding:6px 2px;}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.1s infinite;}
  .typing i:nth-child(2){animation-delay:.18s;}.typing i:nth-child(3){animation-delay:.36s;}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0);}30%{opacity:1;transform:translateY(-3px);}}

  .dock{flex:none;border-top:1px solid var(--line);padding:.55rem .8rem calc(env(safe-area-inset-bottom) + .7rem);
    background:var(--canvas);}
  .dockinner{max-width:640px;margin:0 auto;}
  .suggest{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.5rem;scrollbar-width:none;}
  .suggest::-webkit-scrollbar{display:none;}
  .sg{flex:none;font-size:.79rem;color:var(--muted);background:var(--surface);border:1px solid var(--line);
    border-radius:999px;padding:.36rem .72rem;cursor:pointer;white-space:nowrap;font-family:inherit;}
  .sg:active{background:var(--accent-soft);}
  .inputbar{display:flex;align-items:center;gap:.45rem;background:var(--surface);border:1px solid var(--line-2);
    border-radius:999px;padding:.4rem .45rem .4rem .9rem;box-shadow:0 2px 8px rgba(1,30,92,.05);}
  .inputbar input{flex:1;border:none;outline:none;background:transparent;font-family:inherit;font-size:1rem;color:var(--ink);}
  .inputbar input::placeholder{color:var(--faint);}
  .inputbar .go{width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;display:grid;
    place-items:center;font-size:.95rem;flex:none;border:none;cursor:pointer;}
  .inputbar .go:disabled{background:var(--line-2);cursor:default;}

  .loading{margin:auto;text-align:center;color:var(--faint);font-size:.85rem;}
</style>
</head>
<body>
  <div class="top">
    <div class="brand">
      <div class="dot"><img src="/icons/fl-icon.svg" alt="Buddy"></div>
      <div class="name">Buddy<small>FocusLedger</small></div>
    </div>
    <div class="top-actions">
      <a class="chiplink today" href="/app/today">Full day</a>
      <a class="chiplink" href="/app">See modules</a>
    </div>
  </div>

  <div class="thread" id="thread">
    <div class="loading" id="loading">…</div>
  </div>

  <div class="dock">
    <div class="dockinner">
      <div class="suggest" id="suggest"></div>
      <div class="inputbar">
        <input id="input" placeholder="Tell Buddy anything…" autocomplete="off" enterkeyhint="send"/>
        <button class="go" id="go" aria-label="Send">↑</button>
      </div>
    </div>
  </div>

<script src="/js/push-autoheal.js" defer></script>
<script src="/js/reward.js" defer></script>
<script>
(function(){
  'use strict';
  var TOKEN = localStorage.getItem('fl_token');
  if(!TOKEN){ window.location.href = '/login?redirect=weightless'; return; }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The signed-in user's first name (set at login), never a hardcoded one.
  var firstName = '';
  try { firstName = ((JSON.parse(localStorage.getItem('fl_user') || '{}').name) || '').trim().split(/\s+/)[0]; } catch (e) { firstName = ''; }
  function hello(part){ return part + (firstName ? ', ' + firstName : '') + '.'; }
  var thread = document.getElementById('thread');
  var input  = document.getElementById('input');
  var go      = document.getElementById('go');
  var busy = false;
  // While Buddy is gathering info for an action (e.g. asked "what's their email?"),
  // keep the next message in the action flow instead of re-guessing intent.
  var pendingAct = false;

  // ── helpers ────────────────────────────────────────────────────────────────
  function scroll(){ thread.scrollTop = thread.scrollHeight; }
  function node(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  // Buddy replies are lightly formatted (**bold**, *italic*, newlines). Escape first, then inline-format.
  function fmt(s){
    return esc(s)
      .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g,'<em>$1</em>')
      .replace(/\n/g,'<br>');
  }

  function user(text){ var n=node('<div class="u"></div>'); n.textContent=text; thread.appendChild(n); scroll(); }
  function buddy(html, soul){
    var n=node('<div class="b"><div class="dot"><img src="/icons/fl-icon.svg" alt="Buddy"></div><div class="msg'+(soul?' soul':'')+'"></div></div>');
    n.querySelector('.msg').innerHTML = html;
    thread.appendChild(n); scroll();
  }
  function raw(html){ var n=node(html); thread.appendChild(n); scroll(); return n; }
  function note(text, warm){ raw('<div class="note'+(warm?' warm':'')+'">'+esc(text)+'</div>'); }

  function chips(list){
    var wrap=document.createElement('div'); wrap.className='chips';
    list.forEach(function(c){
      var b=document.createElement('button'); b.className='chip '+(c.k||'ghost'); b.textContent=c.label;
      if(c.task!=null) b.setAttribute('data-task', c.task);
      b.onclick=function(){ if(busy) return; wrap.remove(); if(c.fn) c.fn(); else send(c.send||c.label); };
      wrap.appendChild(b);
    });
    thread.appendChild(wrap); scroll(); return wrap;
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, reduce?40:ms); }); }
  var _typingEl=null;
  function showTyping(){
    if(_typingEl) return;
    _typingEl=node('<div class="b"><div class="dot"><img src="/icons/fl-icon.svg" alt="Buddy"></div><div class="typing"><i></i><i></i><i></i></div></div>');
    thread.appendChild(_typingEl); scroll();
  }
  function hideTyping(){ if(_typingEl){ _typingEl.remove(); _typingEl=null; } }

  function api(path, opts){
    opts = opts || {};
    opts.headers = Object.assign({ 'Authorization':'Bearer '+TOKEN }, opts.headers||{});
    if(opts.body && typeof opts.body!=='string'){
      opts.headers['Content-Type']='application/json';
      opts.body=JSON.stringify(opts.body);
    }
    return fetch(path, opts).then(function(r){
      if(r.status===401){
        // Token is dead — clear it so /login doesn't bounce us straight back
        // (login redirects away whenever fl_token exists), and tell login why.
        localStorage.removeItem('fl_token');
        window.location.href='/login?redirect=weightless&reason=expired';
        throw new Error('unauthorized');
      }
      return r.json();
    });
  }

  function setBusy(v){ busy=v; go.disabled=v; }

  // ── greeting from real /api/buddy/status ────────────────────────────────────
  function fmtDue(dueDate, today){
    if(!dueDate) return null;
    var d = String(dueDate).slice(0,10);
    // Make "when" concrete (time-blindness): Today / Tomorrow / weekday / date,
    // matching the shared formatRelativeDue vocabulary used on the tasks page.
    var base = new Date(d+'T00:00:00');
    var t0 = new Date(today+'T00:00:00');
    if(isNaN(base.getTime()) || isNaN(t0.getTime())){
      if(d < today) return {label:'overdue', over:true};
      if(d === today) return {label:'today', over:false};
      return {label:base.toLocaleDateString(undefined,{month:'short',day:'numeric'}), over:false};
    }
    var diff = Math.round((base - t0)/86400000);
    if(diff < 0) return {label:'overdue', over:true};
    if(diff === 0) return {label:'today', over:false};
    if(diff === 1) return {label:'tomorrow', over:false};
    if(diff <= 6) return {label:base.toLocaleDateString(undefined,{weekday:'short'}), over:false};
    return {label:base.toLocaleDateString(undefined,{month:'short',day:'numeric'}), over:false};
  }

  // ── radar: finish a task right where you see it ─────────────────────────────
  // Tap the box → it checks, bursts, says something short, then slides out and
  // the next task steps up. Delay-aversion lever: the reward lands the instant
  // you act, and the next small win is already in reach. Variable reward (the
  // label and burst size change) keeps it from going stale.
  var REWARD_LABELS = ['✓ done', '✓ nice', '✓ off your plate', '✓ one less', '✓ handled'];
  function cheerLine(n){
    if(n===1) return 'One down. Starting is the hard part.';
    if(n===2) return "Two. That's momentum.";
    if(n===3) return "Three. You're in it now.";
    return n+' this sitting. Ride it, or stop here. Both count.';
  }
  var radar = null; // { card, list, label, tally, cheer, items, queue, today, doneToday, session }

  function taskRow(t, today, onDone){
    var due = fmtDue(t.due_date, today);
    var row = node('<div class="row"><button class="chk" type="button" role="checkbox" aria-checked="false"><span class="box"></span></button>'+
      '<span class="lbl"></span>'+(due?'<span class="due'+(due.over?' over':'')+'">'+due.label+'</span>':'')+'</div>');
    row.querySelector('.lbl').textContent = t.title;
    var btn = row.querySelector('.chk');
    btn.setAttribute('aria-label', 'Mark "'+t.title+'" done');
    btn.onclick = function(){ onDone(row, t); };
    return row;
  }
  function markRow(row, on){
    row.classList.toggle('done', on);
    var btn = row.querySelector('.chk');
    btn.setAttribute('aria-checked', on ? 'true' : 'false');
    btn.disabled = on;
  }
  function burst(el, big, label){
    if(window.flReward) window.flReward.celebrateEl(el, {
      label: label || REWARD_LABELS[Math.floor(Math.random()*REWARD_LABELS.length)], count: big ? 16 : 8 });
    try{ if(!reduce && navigator.vibrate) navigator.vibrate(12); }catch(e){}
  }

  // Same endpoint the tasks page uses (it also spawns the next occurrence of a
  // recurring task). It's a toggle, so guard a stale radar: if the task was
  // already finished elsewhere, the first flip reopened it — flip it back.
  function toggleTask(t){
    return api('/api/tasks/'+t.id+'/toggle', { method:'PATCH' }).then(function(res){
      if(!res || !res.success || !res.task) throw new Error('toggle failed');
      return res.task;
    });
  }
  function completeTask(t){
    return toggleTask(t).then(function(task){
      if(task.is_completed) return task;
      return toggleTask(t).then(function(again){
        if(!again.is_completed) throw new Error('toggle failed');
        return again;
      });
    });
  }
  function removeTaskChips(id){
    thread.querySelectorAll('.chip[data-task="'+id+'"]').forEach(function(c){ c.remove(); });
  }

  function setRadarHeader(){
    // Count only what's shown (max 3), never the whole pile behind it.
    var shown = radar.items.length;
    radar.label.textContent = !shown ? 'Radar clear' : (shown===1 && !radar.queue.length ? 'On your radar' : 'Your radar · '+shown);
    radar.tally.textContent = radar.doneToday > 0 ? '✓ '+radar.doneToday+' done today' : '';
  }
  function setCheer(text, undoFn){
    radar.cheer.textContent = text || '';
    if(undoFn){
      var u = document.createElement('button'); u.className = 'undo'; u.textContent = 'Undo';
      u.style.marginLeft = '.4rem';
      u.onclick = function(){ u.disabled = true; u.textContent = '…'; undoFn(u); };
      radar.cheer.appendChild(u);
      var shownFor = text;
      setTimeout(function(){ if(u.isConnected && !u.disabled && radar.cheer.firstChild && radar.cheer.firstChild.nodeValue===shownFor) u.remove(); }, 8000);
    }
  }
  function renderRadarList(){
    radar.list.innerHTML = '';
    radar.items.forEach(function(t){ radar.list.appendChild(taskRow(t, radar.today, onRadarDone)); });
    radar.card.classList.toggle('clear', !radar.items.length);
    setRadarHeader();
  }

  function renderRadar(tasks, today, doneToday){
    radar = { items: tasks.slice(0,3), queue: tasks.slice(3), today: today, doneToday: doneToday, session: 0 };
    radar.card = raw('<div class="card"><div class="k"><span class="kl"></span><span class="tally"></span></div>'+
      '<div class="tasklist"></div><div class="cheer" aria-live="polite"></div></div>');
    radar.label = radar.card.querySelector('.kl');
    radar.tally = radar.card.querySelector('.tally');
    radar.list  = radar.card.querySelector('.tasklist');
    radar.cheer = radar.card.querySelector('.cheer');
    renderRadarList();
  }

  function onRadarDone(row, t){
    if(row.classList.contains('done')) return;
    markRow(row, true);
    radar.session++; radar.doneToday++;
    var n = radar.session;
    burst(row.querySelector('.box'), n % 3 === 0);
    setRadarHeader();
    setCheer(cheerLine(n));
    removeTaskChips(t.id);
    var advanceTimer = setTimeout(function(){ advanceRadar(row, t); }, reduce ? 150 : 900);

    completeTask(t).then(function(){
      setCheer(cheerLine(n), function(btn){
        clearTimeout(advanceTimer);
        toggleTask(t).then(function(task){
          if(task.is_completed) throw new Error('undo failed');
          putBack(row, t);
          setCheer('↩ Back on your radar.');
        }).catch(function(err){
          if(err && err.message==='unauthorized') return;
          console.error('[weightless] undo failed:', err && err.message, '| task:', t.id);
          btn.disabled = false; btn.textContent = 'Undo';
        });
      });
    }).catch(function(err){
      if(err && err.message==='unauthorized') return;
      console.error('[weightless] complete failed:', err && err.message, '| task:', t.id);
      clearTimeout(advanceTimer);
      putBack(row, t);
      setCheer('');
      buddy("That didn't save, so it's still on your radar. Try again?");
    });
  }

  // Undo or a failed save: the task goes back to the top of the radar.
  function putBack(row, t){
    radar.session = Math.max(0, radar.session-1);
    radar.doneToday = Math.max(0, radar.doneToday-1);
    if(row.isConnected && !row.classList.contains('leaving')){
      markRow(row, false);
      setRadarHeader();
      return;
    }
    markRow(row, false); // so a slide-out still in flight bails instead of pulling in another task
    radar.items = radar.items.filter(function(x){ return x.id!==t.id; });
    radar.items.unshift(t);
    if(radar.items.length > 3) radar.queue.unshift(radar.items.pop());
    renderRadarList();
  }

  function advanceRadar(row, t){
    if(!row.isConnected || !row.classList.contains('done')) return;
    radar.items = radar.items.filter(function(x){ return x.id!==t.id; });
    row.classList.add('leaving');
    setTimeout(function(){
      if(!row.classList.contains('done')) return; // undone mid-slide
      row.remove();
      var next = radar.queue.shift();
      if(next){
        radar.items.push(next);
        var r = taskRow(next, radar.today, onRadarDone);
        r.classList.add('entering');
        radar.list.appendChild(r);
      }
      setRadarHeader();
      if(!radar.items.length) radarClear();
    }, reduce ? 0 : 320);
  }

  function radarClear(){
    radar.card.classList.add('clear');
    setRadarHeader();
    burst(radar.card, true, '✦ radar clear');
    setCheer("Nothing left that's due right now.");
    buddy(fmt('**Radar clear.** Everything due right now is handled.'), true);
    // Retire the old "Start: …" row so there's one clear next step.
    thread.querySelectorAll('.chips').forEach(function(c){ if(!c.closest('.billask')) c.remove(); });
    chips([
      { label:'Pull one more', k:'good', send:"What's next?" },
      { label:"I'm done for today", k:'ghost', send:"I'm done for today" }
    ]);
  }

  // ── bills coming up (bill guardian: /api/plaid/recurring) ──────────────────
  // Obligations and subscriptions predicted in the next 7 days, plus the one
  // question the guardian wants answered, at most once a day per merchant.
  function addDays(iso, n){
    var d = new Date(iso+'T00:00:00'); d.setDate(d.getDate()+n);
    var m = d.getMonth()+1, day = d.getDate();
    return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(day<10?'0':'')+day;
  }
  function dollars(cents){
    var v = cents/100;
    return '$' + (cents % 100 ? v.toFixed(2) : v.toFixed(0));
  }
  function askAllowed(ask, today){
    var mark = ask.merchant_key+'|'+today;
    try{
      if(localStorage.getItem('fl_bill_ask_seen') === mark) return false;
      localStorage.setItem('fl_bill_ask_seen', mark);
    }catch(e){ /* storage blocked: just show it */ }
    return true;
  }

  function billsCard(rec, today, tasks){
    if(!rec || !rec.success || !Array.isArray(rec.streams)) return;
    var horizon = addDays(today, 7);
    var up = rec.streams.filter(function(s){
      return (s.bucket==='obligation' || s.bucket==='subscription') && s.cancel_status!=='confirmed' &&
        s.predicted_next >= today && s.predicted_next <= horizon;
    });
    var ask = rec.ask && askAllowed(rec.ask, today) ? rec.ask : null;
    var settled = Array.isArray(rec.cancellations) ? rec.cancellations : [];
    if(!up.length && !ask && !settled.length) return;

    var onRadar = {};
    (tasks||[]).forEach(function(t){ if(t.source==='auto_bill' && t.bill_merchant_key) onRadar[t.bill_merchant_key] = true; });
    var totalCents = up.reduce(function(sum, s){ return sum + Math.round(Number(s.typical_amount)*100); }, 0);

    var html = '<div class="card"><div class="k">Bills · next 7 days</div>';
    if(up.length){
      html += '<div class="mh"><span class="big">~'+dollars(totalCents)+'</span>'+
        '<span class="split">'+up.length+' coming up</span></div>';
    } else {
      html += '<div class="say">Nothing predicted this week.</div>';
    }
    html += '</div>';
    var card = raw(html);
    settled.forEach(function(c){ cancellationNote(card, c, rec, today); });
    up.forEach(function(s){
      var when = fmtDue(s.predicted_next, today) || { label:'' };
      var soon = when.label==='today' || when.label==='tomorrow';
      var pending = s.cancel_status==='pending';
      var reviewable = s.bucket==='subscription' && !pending && !recentlyKept(s.kept_at);
      var row = node('<div class="billrow"><span class="bn">'+esc(s.name)+'</span>'+
        (pending ? '<span class="tag pend">cancelling</span>' : s.bucket==='subscription' ? '<span class="tag sub">sub</span>' : '')+
        '<span class="bw'+(soon&&!pending?' soon':'')+'">'+(pending ? 'checking after '+esc((fmtDue(s.cancel_expected_by||s.predicted_next, today)||{label:''}).label)
          : esc(when.label)+(onRadar[s.merchant_key]?' · on radar':''))+'</span>'+
        '<span class="ba">~'+dollars(Math.round(Number(s.typical_amount)*100))+'</span>'+
        (reviewable ? '<span class="chev" aria-hidden="true">›</span>' : '')+'</div>');
      card.appendChild(row);
      if(reviewable) makeReviewable(row, s, today);
    });
    if(ask) billAsk(card, ask, today);
  }

  // ── subscription review: cancel / keep / it's actually a bill ──────────────
  var PER_YEAR = { weekly:52, biweekly:26, monthly:12, quarterly:4, annual:1 };
  var PER_LABEL = { weekly:'a week', biweekly:'every two weeks', monthly:'a month', quarterly:'a quarter', annual:'a year' };
  var KEEP_REST_DAYS = 90;
  function recentlyKept(keptAt){
    if(!keptAt) return false;
    var t = new Date(keptAt).getTime();
    return !isNaN(t) && (Date.now() - t) < KEEP_REST_DAYS*86400000;
  }
  function weekdayOf(iso){
    var d = new Date(iso+'T00:00:00');
    return isNaN(d.getTime()) ? iso : d.toLocaleDateString(undefined, { weekday:'short', month:'short', day:'numeric' });
  }

  function makeReviewable(row, s, today){
    row.classList.add('subrow');
    row.setAttribute('role', 'button');
    row.setAttribute('tabindex', '0');
    row.setAttribute('aria-expanded', 'false');
    row.setAttribute('aria-label', 'Review '+s.name+' subscription');
    var panel = null;
    function toggle(){
      if(panel){ panel.remove(); panel = null; row.classList.remove('open'); row.setAttribute('aria-expanded','false'); return; }
      panel = document.createElement('div'); panel.className = 'subpanel';
      row.after(panel);
      row.classList.add('open'); row.setAttribute('aria-expanded','true');
      subActions(panel, s, today, function(outcome){
        // Once decided, the row stops being a review button.
        row.classList.remove('subrow','open'); row.removeAttribute('role'); row.removeAttribute('tabindex');
        row.removeAttribute('aria-expanded'); row.removeAttribute('aria-label');
        row.onclick = null; row.onkeydown = null;
        var chev = row.querySelector('.chev'); if(chev) chev.remove();
        if(outcome==='bill'){ var tag = row.querySelector('.tag.sub'); if(tag) tag.remove(); }
      });
    }
    row.onclick = toggle;
    row.onkeydown = function(e){ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); toggle(); } };
  }

  // Renders the decision into `box`. onDecided(outcome) fires once the choice saved.
  function subActions(box, s, today, onDecided){
    var cents = Math.round(Number(s.typical_amount)*100);
    var perYear = PER_YEAR[s.frequency];
    var say = document.createElement('div'); say.className = 'say';
    say.innerHTML = '<strong>'+esc(s.name)+'</strong> is about '+dollars(cents)+' '+esc(PER_LABEL[s.frequency]||s.frequency)+
      (perYear && perYear>1 ? ', roughly <strong>'+dollars(cents*perYear)+' a year</strong>' : '')+
      '. Next charge '+esc(weekdayOf(s.predicted_next))+'. Still worth it?';
    var row = document.createElement('div'); row.className = 'chips';
    function lock(on){ row.querySelectorAll('button').forEach(function(b){ b.disabled = on; }); }
    function fail(err, what){
      if(err && err.message==='unauthorized') return;
      console.error('[weightless] subscription '+what+' failed:', err && err.message, '| merchant:', s.merchant_key);
      lock(false);
      say.textContent = (err && err.userMessage) || "Couldn't save that. Try again?";
    }
    [['Cancel it','cancel','warm'], ['Keep it','keep','ghost'], ['Not a subscription','bill','ghost']].forEach(function(o){
      var b = document.createElement('button'); b.className = 'chip '+o[2]; b.textContent = o[0];
      b.onclick = function(e){
        e.stopPropagation(); lock(true);
        if(o[1]==='cancel') cancelSub(box, say, row, s, today, onDecided, fail);
        else if(o[1]==='keep'){
          api('/api/plaid/recurring/'+encodeURIComponent(s.merchant_key)+'/keep', { method:'POST', body:{ name:s.name } })
            .then(function(res){
              if(!res || !res.success) throw new Error((res && res.message) || 'keep failed');
              row.remove();
              say.textContent = "Kept. I'll check in about it again in 3 months.";
              onDecided('keep');
            }).catch(function(err){ fail(err, 'keep'); });
        } else {
          api('/api/plaid/recurring/'+encodeURIComponent(s.merchant_key)+'/bucket', { method:'POST', body:{ bucket:'obligation', name:s.name } })
            .then(function(res){
              if(!res || !res.success) throw new Error((res && res.message) || 'save failed');
              row.remove();
              say.textContent = "Got it, it's a bill. I'll remind you before it's due.";
              onDecided('bill');
            }).catch(function(err){ fail(err, 'reclassify'); });
        }
      };
      row.appendChild(b);
    });
    box.appendChild(say); box.appendChild(row);
    scroll();
  }

  // Buddy can't cancel a service for you. So: record the cancel (the bill guardian
  // then checks the bank and reports whether it actually worked), open the
  // merchant's own cancel page when we know it, and keep a dated backup task.
  function cancelLinkChip(link){
    var a = document.createElement('a'); a.className = 'chip solid';
    a.href = link.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = link.store ? 'Open '+link.label+' subscriptions ↗' : 'Open '+link.label+'’s cancel page ↗';
    a.onclick = function(e){ e.stopPropagation(); };
    return a;
  }
  // No curated cancel page: a web search is honest and always works.
  function searchChip(name){
    var a = document.createElement('a'); a.className = 'chip solid';
    a.href = 'https://www.google.com/search?q='+encodeURIComponent('how to cancel '+name+' subscription');
    a.target = '_blank'; a.rel = 'noopener noreferrer';
    a.textContent = 'Find '+name+'’s cancel page ↗';
    a.onclick = function(e){ e.stopPropagation(); };
    return a;
  }

  // Steps render right here in the card, not as a chat message the user didn't type.
  function showSteps(box, chipsRow, how, s){
    how.disabled = true; how.textContent = '…';
    api('/api/plaid/recurring/'+encodeURIComponent(s.merchant_key)+'/cancel-help', { method:'POST', body:{ name:s.name } })
      .then(function(res){
        if(!res || !res.success || !Array.isArray(res.steps) || !res.steps.length) throw new Error('no steps');
        how.remove();
        var ol = document.createElement('ol'); ol.className = 'steps';
        res.steps.forEach(function(t){ var li = document.createElement('li'); li.textContent = t; ol.appendChild(li); });
        chipsRow.before(ol);
        var fine = document.createElement('div'); fine.className = 'fine';
        fine.textContent = res.source==='ai' ? "Buddy's best directions. Menus change, so go by what you see." : 'General steps. Menus vary by service.';
        ol.after(fine);
        scroll();
      })
      .catch(function(err){
        if(err && err.message==='unauthorized') return;
        console.error('[weightless] cancel steps failed:', err && err.message, '| merchant:', s.merchant_key);
        how.disabled = false; how.textContent = 'Show me how';
      });
  }

  function requestCancel(s){
    return api('/api/plaid/recurring/'+encodeURIComponent(s.merchant_key)+'/cancel', { method:'POST', body:{
      name: s.name, expected_by: s.predicted_next, amount: Number(s.typical_amount), frequency: s.frequency } })
      .then(function(res){
        if(!res || !res.success) throw new Error((res && res.message) || 'cancel request failed');
        return res;
      });
  }

  function cancelSub(box, say, row, s, today, onDecided, fail){
    var due = addDays(s.predicted_next, -1);
    if(due < today) due = today;
    var cents = Math.round(Number(s.typical_amount)*100);
    var perYear = PER_YEAR[s.frequency];
    var title = ('Cancel '+s.name+' before it renews').slice(0, 150);
    requestCancel(s).then(function(res){
      // Backup task; if it can't be added (e.g. the free-plan cap) the cancel still stands.
      return api('/api/tasks', { method:'POST', body:{
        title: title, due_date: due, priority: 'medium',
        description: 'Renews around '+s.predicted_next+' for about '+dollars(cents)+
          (perYear && perYear>1 ? ' (roughly '+dollars(cents*perYear)+' a year)' : '')+'. Spotted by FocusLedger in your bank history.'
      }}).then(function(t){ return { link: res.cancel_link, task: t && t.success && t.task ? t.task : null, taskMsg: t && !t.success ? t.message : null }; },
               function(err){
                 if(err && err.message==='unauthorized') throw err;
                 console.error('[weightless] backup cancel task failed:', err && err.message, '| merchant:', s.merchant_key);
                 return { link: res.cancel_link, task: null, taskMsg: null };
               });
    }).then(function(r){
      row.remove();
      say.innerHTML = '✓ On it. I’ll watch your bank: if no <strong>'+esc(s.name)+'</strong> charge shows up after '+
        esc((fmtDue(s.predicted_next, today) || { label:s.predicted_next }).label)+', I’ll mark it cancelled.';
      var undo = document.createElement('button'); undo.className = 'undo'; undo.textContent = 'Undo';
      say.appendChild(undo);

      var next = document.createElement('div'); next.className = 'chips';
      next.appendChild(r.link ? cancelLinkChip(r.link) : searchChip(s.name));
      var how = document.createElement('button'); how.className = 'chip good'; how.textContent = 'Show me how';
      how.onclick = function(e){
        e.stopPropagation();
        showSteps(box, next, how, s);
      };
      next.appendChild(how);
      box.appendChild(next);

      var fine = document.createElement('div'); fine.className = 'fine';
      var whenLbl = (fmtDue(due, today) || { label:due }).label;
      fine.textContent = r.task ? 'Backup task added for '+whenLbl+(due===today ? '' : ', the day before it renews')+'.'
        : (r.taskMsg ? 'No backup task: '+r.taskMsg : '');
      if(fine.textContent) box.appendChild(fine);

      undo.onclick = function(e){
        e.stopPropagation(); undo.disabled = true; undo.textContent = '…';
        Promise.all([
          api('/api/plaid/recurring/'+encodeURIComponent(s.merchant_key)+'/cancel', { method:'DELETE' }),
          r.task ? api('/api/tasks/'+r.task.id, { method:'DELETE' }) : Promise.resolve({ success:true })
        ]).then(function(rs){
          if(!rs[0] || !rs[0].success || !rs[1] || !rs[1].success) throw new Error('undo failed');
          say.textContent = 'Undone. It stays on your bills.';
          next.remove(); if(fine.parentNode) fine.remove();
        }).catch(function(err){
          if(err && err.message==='unauthorized') return;
          console.error('[weightless] undo cancel failed:', err && err.message, '| merchant:', s.merchant_key);
          undo.disabled = false; undo.textContent = 'Undo';
        });
      };
      onDecided('cancel');
      scroll();
    }).catch(function(err){ fail(err, 'cancel'); });
  }

  // A settled cancellation, decided by the bill guardian from bank data.
  function cancellationNote(card, c, rec, today){
    var k = card.querySelector('.k');
    var cents = c.amount ? Math.round(c.amount*100) : 0;
    var perYear = PER_YEAR[c.frequency] || 0;
    var note = document.createElement('div');
    if(c.status === 'confirmed'){
      note.className = 'cancelnote win';
      note.innerHTML = '✓ <strong>'+esc(c.name)+' cancelled.</strong> No charge since you cancelled'+
        (cents && perYear ? '. That’s about <strong>'+dollars(cents*perYear)+' a year</strong> back.' : '.');
      k.after(note);
      // Celebrate once per merchant: the win is the point.
      var seenKey = 'fl_cancel_win_'+c.merchant_key, seen = false;
      try{ seen = localStorage.getItem(seenKey)==='1'; localStorage.setItem(seenKey,'1'); }catch(e){}
      if(!seen) setTimeout(function(){ burst(note, true, '✓ cancelled'); }, 400);
      return;
    }
    note.className = 'cancelnote alert';
    note.innerHTML = '<strong>'+esc(c.name)+'</strong> charged you again after you cancelled. It may not have gone through.';
    var chipsRow = document.createElement('div'); chipsRow.className = 'chips';
    chipsRow.appendChild(c.cancel_link ? cancelLinkChip(c.cancel_link) : searchChip(c.name));
    var stream = (rec.streams||[]).filter(function(x){ return x.merchant_key===c.merchant_key; })[0];
    var retry = document.createElement('button'); retry.className = 'chip warm'; retry.textContent = 'Try again';
    var keep = document.createElement('button'); keep.className = 'chip ghost'; keep.textContent = 'Keep it';
    function lock(on){ retry.disabled = on; keep.disabled = on; }
    retry.onclick = function(){
      lock(true);
      var s = stream || { merchant_key:c.merchant_key, name:c.name, typical_amount:c.amount,
        frequency:c.frequency || 'monthly', predicted_next:addDays(today, 30) };
      requestCancel(s).then(function(){
        chipsRow.querySelectorAll('button').forEach(function(b){ b.remove(); });
        note.className = 'cancelnote win';
        note.innerHTML = 'Watching again. I’ll check your bank after '+
          esc((fmtDue(s.predicted_next, today) || { label:s.predicted_next }).label)+'.';
        note.appendChild(chipsRow);
      }).catch(function(err){
        if(err && err.message==='unauthorized') return;
        console.error('[weightless] cancel retry failed:', err && err.message, '| merchant:', c.merchant_key);
        lock(false);
      });
    };
    keep.onclick = function(){
      lock(true);
      api('/api/plaid/recurring/'+encodeURIComponent(c.merchant_key)+'/keep', { method:'POST', body:{ name:c.name } })
        .then(function(res){
          if(!res || !res.success) throw new Error('keep failed');
          note.className = 'cancelnote win';
          note.textContent = 'Kept. I’ll check in about '+c.name+' again in 3 months.';
        }).catch(function(err){
          if(err && err.message==='unauthorized') return;
          console.error('[weightless] keep after charge failed:', err && err.message, '| merchant:', c.merchant_key);
          lock(false);
        });
    };
    chipsRow.appendChild(retry); chipsRow.appendChild(keep);
    note.appendChild(chipsRow);
    k.after(note);
  }

  function billAsk(card, ask, today){
    var box = document.createElement('div'); box.className = 'billask';
    var q = document.createElement('div'); q.className = 'q';
    q.innerHTML = 'Quick one: is <strong>'+esc(ask.name)+'</strong> (~'+dollars(Math.round(Number(ask.typical_amount)*100))+', '+esc(ask.frequency)+') a bill I should remind you about?';
    var row = document.createElement('div'); row.className = 'chips';
    [['Yes, remind me','obligation','solid'], ["It's a subscription",'subscription','ghost'], ['Neither','habit','ghost']].forEach(function(o){
      var b = document.createElement('button'); b.className = 'chip '+o[2]; b.textContent = o[0];
      b.onclick = function(){
        row.querySelectorAll('button').forEach(function(x){ x.disabled = true; });
        api('/api/plaid/recurring/'+encodeURIComponent(ask.merchant_key)+'/bucket', { method:'POST', body:{ bucket:o[1], name:ask.name } })
          .then(function(res){
            if(!res || !res.success) throw new Error((res && res.message) || 'save failed');
            row.remove();
            q.textContent = o[1]==='obligation' ? "Got it. I'll remind you before it's due." : "Got it. I'll remember that.";
            if(o[1]==='subscription'){
              var panel = document.createElement('div'); panel.className = 'subpanel';
              box.appendChild(panel);
              subActions(panel, ask, today, function(){});
            }
          })
          .catch(function(err){
            if(err && err.message==='unauthorized') return;
            console.error('[weightless] bill answer failed:', err && err.message, '| merchant:', ask.merchant_key);
            row.querySelectorAll('button').forEach(function(x){ x.disabled = false; });
            q.textContent = "Couldn't save that. Try again?";
          });
      };
      row.appendChild(b);
    });
    box.appendChild(q); box.appendChild(row);
    card.appendChild(box); scroll();
  }

  function greet(data, reveal, rec){
    document.getElementById('loading').remove();
    var tasks = (data.tasks||[]);
    var done  = data.tasksCompletedToday||0;
    var slots = data.dailyPlanSlots||null;
    var deferred = (data.deferredItems||[]);
    var today = data.date;
    var hour = new Date().getHours();
    var partOfDay = hour<12?'Morning':hour<18?'Afternoon':'Evening';

    var remindId = new URLSearchParams(location.search).get('remind');

    showTyping();
    wait(500).then(function(){
      hideTyping();

      // Landed from a reminder notification → surface JUST that one task, calmly,
      // with a clear next action. One thing, not the whole pile — the opposite of
      // dumping the user on a dense list.
      if(remindId){
        var rt = tasks.filter(function(x){ return String(x.id)===String(remindId); })[0];
        try{ history.replaceState(null,'','/weightless'); }catch(e){}
        if(rt){
          buddy(hello(partOfDay)+' You asked me to remind you about this:', true);
          var rcard = raw('<div class="card"><div class="k">Reminder</div><div class="tasklist"></div></div>');
          var rchips = null;
          rcard.querySelector('.tasklist').appendChild(taskRow(rt, today, function(row, t){
            if(row.classList.contains('done')) return;
            markRow(row, true); burst(row.querySelector('.box'), true);
            if(rchips) rchips.remove();
            completeTask(t).then(function(){ buddy("Done. That one's off your mind."); })
              .catch(function(err){
                if(err && err.message==='unauthorized') return;
                console.error('[weightless] reminder complete failed:', err && err.message, '| task:', t.id);
                markRow(row, false);
                buddy("That didn't save. Tap it again, or tell me and I'll mark it.");
              });
          }));
          buddy('Want to knock it out now?');
          rchips = chips([
            { label:'✓ Mark it done', k:'ghost', send:'mark "'+rt.title+'" done' },
            { label:'Snooze to tomorrow', k:'ghost', send:'move "'+rt.title+'" to tomorrow' },
            { label:"I'll start now", k:'warm', send:"Let's start on: "+rt.title }
          ]);
          return; // focused landing — skip the full radar
        }
        // task not found (already done, or off the list) → fall through to the normal greeting
      }

      // Daily Reveal — the curiosity-gap pull-back-in. Surface it right in the
      // greeting (lead with the interesting thing), then continue to the radar.
      // Marked viewed on show, so it appears once.
      if(reveal && !reveal.viewed && reveal.headline){
        buddy('Before your day — I noticed something:', true);
        raw('<div class="card" style="background:var(--accent);border:none;box-shadow:0 10px 26px -12px rgba(1,30,92,.5);">'+
          '<div class="k" style="color:var(--warm);">✦ Daily reveal</div>'+
          '<div style="font-weight:700;font-size:1.05rem;line-height:1.3;margin:.35rem 0 .45rem;color:#fff;">'+esc(reveal.headline)+'</div>'+
          '<div style="font-size:.92rem;line-height:1.5;color:rgba(255,255,255,.88);">'+esc(reveal.body||'')+'</div>'+
          (reveal.science_label?'<div style="margin-top:.65rem;font-size:.76rem;color:rgba(255,255,255,.55);">Why this works: <span style="color:var(--warm);font-weight:600;">'+esc(reveal.science_label)+'</span></div>':'')+
        '</div>');
        if(reveal.id) api('/api/reveals/'+reveal.id+'/viewed', { method:'POST' }).catch(function(){});
      }

      // Resurface anything Buddy parked for later
      if(deferred.length){
        buddy(partOfDay+'. Before anything — you asked me to hold onto a few things. Still want them?', true);
        raw('<div class="card"><div class="k">You parked these</div><div class="tasklist">'+
          deferred.slice(0,4).map(function(x){
            return '<div class="row"><span class="box"></span><span class="lbl">'+esc(x.text)+'</span></div>';
          }).join('')+'</div></div>');
      }

      if(!tasks.length && !slots){
        // Deep-but-empty: invite a brain dump rather than showing a blank slate.
        buddy(partOfDay+'. Clean slate — nothing on your plate that I can see.', true);
        billsCard(rec, today, tasks);
        buddy("Want to empty your head at me? Just say everything that's rattling around and I'll sort it into what matters now, what can wait, and what you can let go of.");
        return;
      }

      var top = tasks.slice(0,3);
      var singular = top.length===1;
      buddy(hello(partOfDay) + (done? ' '+done+' already done today — nice.' : '') +
        (singular ? ' Just one thing on your radar.' : ' Here\'s what\'s actually on your radar — not the whole pile.'), true);

      renderRadar(tasks, today, done);
      billsCard(rec, today, tasks);

      buddy(singular ? 'Want to knock it out now, or should I hold it?'
                     : 'Where do you want to start? Or tell me what\'s actually going on.');
      chips(top.map(function(t){
        return { label:'Start: '+ (t.title.length>22?t.title.slice(0,22)+'…':t.title),
                 k:'ghost', send:"Let's start on: "+t.title, task:t.id };
      }).concat([{label:"I'm stuck", k:'warm', send:"I'm stuck"}]));
    });
  }

  // ── money: summon a real spending card ──────────────────────────────────────
  // The conversation endpoint has no expense context, so it would (correctly)
  // say it can't see transactions. Instead we answer money questions from the
  // real ledger — deterministic data, not a guess.
  function moneyIntent(t){
    return /\b(spend|spent|spending|budget|money|transactions?|expenses?|impulse|afford|purchases?)\b/i.test(t);
  }
  function periodFrom(t){
    if(/\bmonth\b/i.test(t)) return {p:'month', label:'this month'};
    if(/\b(year|ytd)\b/i.test(t)) return {p:'year', label:'this year'};
    if(/\btoday\b/i.test(t)) return {p:'day', label:'today'};
    return {p:'week', label:'this week'};
  }
  function money(text){
    pendingAct = false; // switching lanes to a money question
    user(text); input.value=''; setBusy(true); showTyping();
    var per = periodFrom(text);
    api('/api/expenses/summary?period='+per.p)
      .then(function(res){
        hideTyping();
        var s = res && res.summary;
        if(!res || !res.success || !s){
          buddy("I couldn't reach your spending just now — try again in a moment?");
          return;
        }
        if(!s.total){
          buddy(fmt("Nothing logged "+per.label+" yet, so there's nothing to show. Want to start tracking? Just tell me a purchase like *“spent $6 on coffee”* and I'll keep the ledger."), true);
          return;
        }
        var impPct = s.impulse_pct||0;
        var line = "You're at **$"+s.total.toFixed(2)+"** "+per.label+".";
        if(s.impulse_count>0)      line += " $"+s.impulse_total.toFixed(2)+" of it ("+impPct+"%) was impulse—"+(impPct>=40?"worth a glance":"not bad at all")+".";
        else if(s.total>0)          line += " All of it planned—that's real control.";
        buddy(fmt(line));

        var cats = (s.by_category||[]).filter(function(c){ return Number(c.total)>0; }).slice(0,4);
        var max = cats.reduce(function(m,c){ return Math.max(m, Number(c.total)); }, 0) || 1;
        var splitHtml = s.impulse_count>0
          ? '<span class="split"><span class="imp">$'+s.impulse_total.toFixed(0)+' impulse</span> · $'+s.planned_total.toFixed(0)+' planned</span>'
          : '<span class="split">all planned</span>';
        raw('<div class="card"><div class="k">Spending · '+esc(per.label)+'</div>'+
          '<div class="mh"><span class="big">$'+s.total.toFixed(2)+'</span>'+splitHtml+'</div>'+
          cats.map(function(c){
            var amt=Number(c.total), pct=Math.round(amt/max*100);
            return '<div class="catrow"><span class="ic">'+(c.category_icon||'💳')+'</span>'+
              '<span class="cn">'+esc(c.category_name||'Other')+'</span>'+
              '<span class="track"><span class="fill" style="width:'+pct+'%"></span></span>'+
              '<span class="ca">$'+amt.toFixed(0)+'</span></div>';
          }).join('')+'</div>');

        if(s.untriaged_count>0){
          note('💸 '+s.untriaged_count+' new charge'+(s.untriaged_count>1?'s':'')+' waiting to be sorted', true);
        }
      })
      .catch(function(err){
        hideTyping();
        if(err && err.message==='unauthorized') return;
        console.error('[weightless] money error:', err);
        buddy("Something hiccuped pulling your spending. Try again in a sec?");
      })
      .then(function(){ setBusy(false); input.focus(); });
  }

  // ── actions: let Buddy actually do things (reschedule / mark done) ───────────
  function actionIntent(t){
    return /\b(reschedule|resched|postpone|snooze|bump)\b/i.test(t)
        || /\b(move|push|shift)\b[\s\S]*\b(to|until|till|by|tomorrow|monday|tuesday|wednesday|thursday|friday|saturday|sunday|next)\b/i.test(t)
        || /\b(cross|check)\s*(it|that|them)?\s*off\b/i.test(t)
        || /\bmark(ed)?\b[\s\S]*\b(done|complete)/i.test(t)
        || /\b(done with|finished with)\b/i.test(t)
        || /\be-?mail\b/i.test(t)
        || /\b(send|write|draft)\b[\s\S]*\b(email|message|note|reply)\b/i.test(t)
        || /\breply to\b/i.test(t)
        || /\b(remind|nudg)/i.test(t)
        || /\bevery\s+(day|night|morning|evening|week|month|monday|tuesday|wednesday|thursday|friday|saturday|sunday|weekday)/i.test(t)
        || /\b(nightly|weekly|monthly|biweekly)\b/i.test(t)
        || /\b(recurring|repeat(s|ing)?)\b/i.test(t)
        || /\b(make|change|set|should)\b[\s\S]*\b(recurring|repeat|nightly|daily|weekly|monthly|due date|due time)\b/i.test(t)
        || /\badd (a |an )?(task|reminder|to-?do)\b/i.test(t);
  }

  function receipt(r){
    var world = r.ok && r.scope === 'world';
    var wrap = node('<div class="note'+(r.ok ? (world?' world':'') : ' warm')+'"></div>');
    // Leading scope chip: "App only" (nothing left FocusLedger) vs "Real world"
    // (a real side effect happened, e.g. an email was sent).
    var chip = document.createElement('span'); chip.className = 'scope';
    chip.textContent = r.ok ? (world ? 'Real world' : 'App only') : 'Not done';
    wrap.appendChild(chip);
    var span = document.createElement('span');
    span.textContent = (r.ok ? (world ? '📤 ' : '✓ ') : '· ') + r.summary;
    wrap.appendChild(span);
    // Dopamine on completion — the front door gets the same reward the tasks
    // page does, so finishing a task in conversation actually feels like one.
    if(r.ok && r.action === 'mark_task_done' && window.flReward){
      setTimeout(function(){ window.flReward.celebrateEl(span, { label:'✓ done' }); }, 60);
    }
    if(r.ok && r.undoable && r.id){
      var u = document.createElement('button'); u.className='undo'; u.textContent='Undo';
      u.onclick = function(){
        u.disabled = true; u.textContent = '…';
        api('/api/agent/undo', { method:'POST', body:{ action_id:r.id } })
          .then(function(res){
            if(res && res.success){ span.textContent = '↩ ' + (res.summary||'Undone'); u.remove(); }
            else { u.disabled = false; u.textContent = 'Undo'; }
          })
          .catch(function(){ u.disabled = false; u.textContent = 'Undo'; });
      };
      wrap.appendChild(u);
    }
    thread.appendChild(wrap); scroll();
  }

  // Build conversation context from the visible thread so /act is stateful
  // without any server-side storage (user bubbles + Buddy messages, last 16).
  function threadHistory(){
    var out = [];
    thread.querySelectorAll('.u, .b .msg').forEach(function(el){
      var role = el.classList.contains('u') ? 'user' : 'assistant';
      var txt = (el.textContent || '').trim();
      if(txt) out.push({ role:role, content:txt });
    });
    return out.slice(-16);
  }

  function act(text){
    var history = threadHistory();
    user(text); input.value=''; setBusy(true); showTyping();
    // Unified Buddy (brain-unification U2): one brain that coaches AND acts and
    // reports only what it actually did. Was /api/agent/act.
    api('/api/agent/chat', { method:'POST', body:{ message:text, history:history } })
      .then(function(data){
        hideTyping();
        if(!data || !data.success){ pendingAct = false; buddy("I couldn't do that just now — mind trying again?"); return; }
        if(data.reply) buddy(fmt(data.reply), (data.reply||'').length < 140);
        (data.receipts||[]).forEach(receipt);
        if(data.confirmation) renderConfirm(data.confirmation);
        // Stay in the action flow only while Buddy is still asking for info.
        var acted = (data.receipts && data.receipts.length) || data.confirmation;
        pendingAct = !!(data.reply && !acted && /\?/.test(data.reply));
      })
      .catch(function(err){
        hideTyping();
        if(err && err.message==='unauthorized') return;
        console.error('[weightless] act error:', err);
        buddy("Something hiccuped taking that action. Try again in a sec?");
      })
      .then(function(){ setBusy(false); input.focus(); });
  }

  // ── real-world confirmation: draft an email, review/edit, then send ──────────
  function upsell(){
    buddy(fmt("I've got the whole email drafted for you — but **sending it on your behalf** is an Autopilot thing. Upgrade and I'll handle sends like this end to end."), true);
    raw('<a class="chiplink today" style="align-self:flex-start;text-decoration:none" href="/pricing">See Autopilot →</a>');
  }

  function renderConfirm(c){
    if(c.action_type !== 'draft_and_send_email') return; // only email in this stage
    var p = c.preview || {};
    var card = node('<div class="card confirm"></div>');
    card.innerHTML =
      '<div class="k world">Real world · your ok needed</div>'+
      '<div class="t">'+esc(c.title||'Send this email?')+'</div>'+
      '<div class="efield"><label>To</label><div class="eto"></div></div>'+
      '<div class="efield"><label>Subject</label><input class="esubj" type="text"></div>'+
      '<div class="efield"><label>Message</label><textarea class="ebody"></textarea></div>'+
      '<div class="eactions"></div>';
    card.querySelector('.eto').textContent = p.to || '';
    var subjEl = card.querySelector('.esubj'); subjEl.value = p.subject || '';
    var bodyEl = card.querySelector('.ebody'); bodyEl.value = p.body || '';
    var actions = card.querySelector('.eactions');
    var sent = false;

    function arm(){
      actions.innerHTML = '';
      var send = document.createElement('button'); send.className='chip solid'; send.textContent = c.confirmLabel||'Send it';
      var nope = document.createElement('button'); nope.className='chip ghost'; nope.textContent = c.cancelLabel||'Not yet';
      actions.appendChild(send); actions.appendChild(nope);
      nope.onclick = function(){
        if(sent) return; sent = true;
        api('/api/agent/confirm', { method:'POST', body:{ action_id:c.id, cancel:true } }).catch(function(){});
        card.remove();
        buddy("No rush — it's still just a draft. Say the word when you want it sent.");
      };
      send.onclick = function(){
        if(sent) return;
        subjEl.disabled = true; bodyEl.disabled = true;
        var secs = 5;
        actions.innerHTML = '';
        var msg = document.createElement('span'); msg.className='say';
        var stop = document.createElement('button'); stop.className='undo'; stop.textContent='Undo';
        actions.appendChild(msg); actions.appendChild(stop);
        var stopped = false;
        msg.textContent = 'Sending in ' + secs + '… ';
        var iv = setInterval(function(){
          if(stopped){ clearInterval(iv); return; }
          secs--;
          if(secs <= 0){
            clearInterval(iv); stop.remove(); msg.textContent = 'Sending… '; sent = true;
            api('/api/agent/confirm', { method:'POST', body:{ action_id:c.id, subject:subjEl.value, body:bodyEl.value } })
              .then(function(res){
                if(res && res.success && res.receipt){ card.remove(); receipt(res.receipt); }
                else if(res && res.upsell){ actions.innerHTML=''; upsell(); }
                else { card.remove(); buddy(res && res.message ? res.message : "That didn't go through — nothing was sent."); }
              })
              .catch(function(err){ if(err && err.message==='unauthorized') return; card.remove(); buddy("Something hiccuped sending that — nothing went out."); });
          } else { msg.textContent = 'Sending in ' + secs + '… '; }
        }, 1000);
        stop.onclick = function(){
          stopped = true; clearInterval(iv);
          api('/api/agent/confirm', { method:'POST', body:{ action_id:c.id, cancel:true } }).catch(function(){});
          card.remove();
          buddy("Held off — it's still just a draft. Ready when you are.");
        };
      };
    }
    arm();
    thread.appendChild(card); scroll();
  }

  // ── real conversation turn ──────────────────────────────────────────────────
  // Brain-unification U2: ONE Buddy. Money questions stay a deterministic
  // shortcut; everything else — coaching AND actions — goes through the unified
  // tool-capable brain (act → /api/agent/chat), which coaches when nothing needs
  // doing and reports only what it actually did when it acts. No more client-side
  // intent routing deciding which of two brains gets the message.
  function send(text){
    text = (text||'').trim();
    if(busy || !text) return;
    if(moneyIntent(text)){ money(text); return; }
    act(text);
  }

  // ── suggested prompts (route through the real conversation engine) ──────────
  var SUGGEST = [
    "What did I spend this week?",
    "I'm stuck",
    "Brain dump",
    "I'm done for today"
  ];
  var sg=document.getElementById('suggest');
  SUGGEST.forEach(function(s){
    var b=document.createElement('button'); b.className='sg'; b.textContent=s;
    b.onclick=function(){ if(busy) return; send(s); };
    sg.appendChild(b);
  });

  function submit(){ send(input.value); }
  go.onclick=submit;
  input.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); submit(); } });

  // Keep the whole app inside the *visible* viewport when the mobile keyboard
  // opens — otherwise 100dvh pushes the header (and "See modules") off-screen
  // and it can't be scrolled back while typing.
  if(window.visualViewport){
    var vv = window.visualViewport;
    var fit = function(){ document.body.style.height = vv.height + 'px'; scroll(); };
    vv.addEventListener('resize', fit);
    vv.addEventListener('scroll', fit);
  }

  // ── boot ────────────────────────────────────────────────────────────────────
  // Fetch the day's status + any staged Daily Reveal in parallel. The reveal is
  // surfaced INSIDE the greeting (so the "Buddy found something" nudge lands on the
  // calm home, not the dense dashboard). A reveal failure never blocks the greeting.
  Promise.all([
    api('/api/buddy/status'),
    api('/api/reveals/today').catch(function(){ return null; }),
    // Bills are a bonus: no bank connected, or a failure, just means no card.
    api('/api/plaid/recurring').catch(function(err){
      if(err && err.message!=='unauthorized') console.error('[weightless] bills load failed:', err.message);
      return null;
    })
  ])
    .then(function(results){
      var data = results[0];
      if(!data || !data.success){ throw new Error(data && data.message || 'status failed'); }
      var reveal = (results[1] && results[1].reveal) ? results[1].reveal : null;
      greet(data, reveal, results[2]);
    })
    .catch(function(err){
      if(err && err.message==='unauthorized') return;
      console.error('[weightless] status error:', err);
      var l=document.getElementById('loading'); if(l) l.remove();
      buddy("Hey — I'm having trouble reaching your day right now. Give me a moment, or tell me what you need.");
    });
})();
</script>
